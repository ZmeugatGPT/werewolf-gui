name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release, e.g. v1.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Inject repository and version into module.json
        run: |
          node tools/configure.mjs \
            --owner "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}" \
            --version "${{ steps.version.outputs.version }}"

      - name: Build package
        run: node tools/build.mjs

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          ASSETS="dist/module.json dist/werewolf-gui.zip"
          TITLE="Werewolf GUI ${{ steps.version.outputs.version }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber $ASSETS
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --generate-notes $ASSETS
          else
            gh release create "$TAG" --title "$TITLE" --generate-notes $ASSETS
          fi
